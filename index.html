<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Facts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fact {
            font-size: 1.3em;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
            margin: 0 auto;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .card {
                padding: 30px 20px;
                min-height: 180px;
            }

            .fact {
                font-size: 1.1em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Fun Facts</h1>
        <div class="card">
            <p class="fact" id="factText">Click the button to discover a fun fact!</p>
        </div>
        <button onclick="showRandomFact()">Get New Fact 🔄</button>
    </div>

    <script>
        const facts = [
            "A group of flamingos is called a 'flamboyance'!",
            "Honey never spoils. Archaeologists have found 3,000-year-old honey in Egyptian tombs that was still edible.",
            "Octopuses have three hearts — two pump blood to the gills, and one pumps it to the rest of the body.",
            "Bananas are berries, but strawberries aren't! Botanically speaking, bananas are berries and strawberries are not.",
            "A single bolt of lightning contains enough energy to toast 100,000 slices of bread.",
            "Butterflies taste with their feet to find out whether the leaf they sit on is good to lay eggs on."
        ];

        let currentFactIndex = -1;

        function showRandomFact() {
            const previousIndex = currentFactIndex;
            do {
                currentFactIndex = Math.floor(Math.random() * facts.length);
            } while (currentFactIndex === previousIndex && facts.length > 1);
            
            document.getElementById('factText').textContent = facts[currentFactIndex];
        }

        // Show first fact on page load
        window.addEventListener('load', showRandomFact);
    </script>
</body>
</html>
